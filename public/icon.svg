<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Solid, constant warm sage-green background gradient (Opaque: NO transparent corners so iOS/Android never turn it black!) -->
    <linearGradient id="tbAppBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#5A7D53" />
      <stop offset="50%" stopColor="#4A6E43" />
      <stop offset="100%" stopColor="#3C5C36" />
    </linearGradient>

    <!-- Warm cream radial glow for halo -->
    <radialGradient id="tbHaloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFFDF7" />
      <stop offset="70%" stopColor="#FDF2E2" />
      <stop offset="100%" stopColor="#F5DCBD" />
    </radialGradient>

    <!-- Vibrant fresh sprout leaf gradients -->
    <linearGradient id="tbLeafLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A4C89D" />
      <stop offset="100%" stopColor="#679160" />
    </linearGradient>

    <linearGradient id="tbLeafRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#8EBA86" />
      <stop offset="100%" stopColor="#4E7846" />
    </linearGradient>

    <linearGradient id="tbTopSprout" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#B3D7AC" />
      <stop offset="100%" stopColor="#5D8755" />
    </linearGradient>

    <!-- Gentle Baby Skin Tone -->
    <linearGradient id="tbSkin" x1="50%" y1="10%" x2="50%" y2="90%">
      <stop offset="0%" stopColor="#FFFDFC" />
      <stop offset="100%" stopColor="#FCEADE" />
    </linearGradient>

    <radialGradient id="tbCheek" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#F59F89" stopOpacity="0.65" />
      <stop offset="100%" stopColor="#F59F89" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- 100% Solid Full Square Base (Crucial for iOS PWA and Android Adaptive Icons: zero transparency prevents black circle borders) -->
  <rect width="512" height="512" fill="url(#tbAppBg)" />

  <!-- Subtle inner ambient ring for luxury depth -->
  <circle cx="256" cy="256" r="236" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4" fill="none" />

  <!-- Centered Iconic Sprout & Baby Motif (Strictly placed within 66% safe zone so it displays perfectly on squircle or circle masks) -->
  <g transform="translate(256, 264)">
    
    <!-- Warm Sun Halo / Cradle -->
    <circle cx="0" cy="0" r="148" fill="url(#tbHaloGlow)" />

    <!-- Top Crown Sprout Leaves -->
    <g transform="translate(0, -118)">
      <path d="M -4 4 C -22 -32 -68 -16 -64 16 C -60 42 -20 32 -4 4 Z" fill="url(#tbTopSprout)" />
      <path d="M 4 4 C 22 -32 68 -16 64 16 C 60 42 20 32 4 4 Z" fill="url(#tbTopSprout)" />
      <path d="M 0 0 L 0 28" stroke="#3C5C36" stroke-width="8" stroke-linecap="round" />
    </g>

    <!-- Baby Head -->
    <circle cx="0" cy="-14" r="76" fill="url(#tbSkin)" stroke="#ECCBBA" stroke-width="3" />

    <!-- Sweet Hair Curl -->
    <path d="M 0 -68 C -10 -90 24 -92 20 -72 C 18 -60 4 -60 0 -52" stroke="#68422A" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Peaceful Sleeping Eyes (^ ^) -->
    <path d="M -30 -20 C -24 -32 -10 -32 -4 -20" stroke="#382519" stroke-width="6.5" stroke-linecap="round" fill="none" />
    <path d="M 4 -20 C 10 -32 24 -32 30 -20" stroke="#382519" stroke-width="6.5" stroke-linecap="round" fill="none" />

    <!-- Rosy Baby Cheeks -->
    <circle cx="-38" cy="-4" r="16" fill="url(#tbCheek)" />
    <circle cx="38" cy="-4" r="16" fill="url(#tbCheek)" />

    <!-- Gentle Baby Smile -->
    <path d="M -8 8 C -4 18 4 18 8 8" stroke="#382519" stroke-width="5.5" stroke-linecap="round" fill="none" />

    <!-- Cradling Sprout Leaves (Holding the baby with tender nature) -->
    <g transform="translate(0, 36)">
      <!-- Left Leaf -->
      <path d="M -112 16 C -124 -46 -52 -62 -18 -18 C -26 30 -68 56 -112 16 Z" fill="url(#tbLeafLeft)" />
      <!-- Right Leaf -->
      <path d="M 112 16 C 124 -46 52 -62 18 -18 C 26 30 68 56 112 16 Z" fill="url(#tbLeafRight)" />
      <!-- Stem Base Connection -->
      <path d="M -16 26 C -6 38 6 38 16 26" stroke="#3C5C36" stroke-width="10" stroke-linecap="round" fill="none" />
    </g>

  </g>
</svg>
