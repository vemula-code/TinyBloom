<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Sage Green Gradient -->
    <linearGradient id="tbBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A8C1A2" />
      <stop offset="50%" stopColor="#91A98B" />
      <stop offset="100%" stopColor="#73936D" />
    </linearGradient>

    <!-- Warm Glow Circle Gradient -->
    <radialGradient id="tbWarmGlow512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFF9F0" />
      <stop offset="70%" stopColor="#FDE8D7" />
      <stop offset="100%" stopColor="#F6CBB0" />
    </radialGradient>

    <!-- Leaf Sage Gradients -->
    <linearGradient id="tbLeaf512Left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#A8C1A2" />
      <stop offset="100%" stopColor="#5D7C57" />
    </linearGradient>
    <linearGradient id="tbLeaf512Right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#8DA887" />
      <stop offset="100%" stopColor="#4A6945" />
    </linearGradient>
    <linearGradient id="tbSprout512Top" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#8BA685" />
      <stop offset="100%" stopColor="#5D7C57" />
    </linearGradient>

    <!-- Baby Skin & Cheeks -->
    <linearGradient id="tbSkin512" x1="50%" y1="20%" x2="50%" y2="80%">
      <stop offset="0%" stopColor="#FFFDF7" />
      <stop offset="100%" stopColor="#FBE9DB" />
    </linearGradient>
    <radialGradient id="tbCheek512" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#F5A28E" stopOpacity="0.6" />
      <stop offset="100%" stopColor="#F5A28E" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- App icon squircle background -->
  <rect width="512" height="512" rx="120" fill="url(#tbBgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="112" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="8" fill="none" />

  <!-- Centered Logo Group -->
  <g transform="translate(64, 40) scale(3.2)">
    <!-- Soft Warm Sun/Halo circle -->
    <circle cx="60" cy="62" r="44" fill="url(#tbWarmGlow512)" />

    <!-- Top Sprout Leaves -->
    <path d="M58 35 C52 23, 34 16, 32 30 C30 42, 48 40, 58 35 Z" fill="url(#tbSprout512Top)" />
    <path d="M62 35 C68 21, 88 16, 88 30 C88 42, 70 40, 62 35 Z" fill="url(#tbSprout512Top)" />
    <path d="M60 33 L60 44" stroke="#4A6945" stroke-width="3.5" stroke-linecap="round" />

    <!-- Baby Head Circle -->
    <circle cx="60" cy="58" r="23" fill="url(#tbSkin512)" stroke="#EBD2C1" stroke-width="1.5" />

    <!-- Sweet Hair curl -->
    <path d="M60 41 C57 34, 69 35, 68 41 C67 45, 62 45, 60 47" stroke="#7A5239" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Peaceful Sleeping Eyes (^ ^) -->
    <path d="M51 56 C53 52, 57 52, 59 56" stroke="#4A3425" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M63 56 C65 52, 69 52, 71 56" stroke="#4A3425" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Soft Rosy Cheeks -->
    <circle cx="48" cy="61" r="5" fill="url(#tbCheek512)" />
    <circle cx="72" cy="61" r="5" fill="url(#tbCheek512)" />

    <!-- Gentle Baby Smile -->
    <path d="M58 64 C59.5 67, 62.5 67, 64 64" stroke="#543C2E" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Cradling Sprout Leaves -->
    <path d="M24 76 C20 54, 42 46, 54 62 C50 78, 36 86, 24 76 Z" fill="url(#tbLeaf512Left)" />
    <path d="M96 76 C100 54, 78 46, 66 62 C70 78, 84 86, 96 76 Z" fill="url(#tbLeaf512Right)" />
    <path d="M54 78 C57 82, 63 82, 66 78" stroke="#4A6945" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
